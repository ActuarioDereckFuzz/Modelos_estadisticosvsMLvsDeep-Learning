# Ejecutar desde la raíz: conda env create -f environment.yml
# Solo CPU por defecto; GPU NVIDIA con TensorFlow 2.21 requiere Linux/WSL2
# y configuración CUDA compatible por separado.
name: GLMvsML
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - pip
  - pip:
      - -r requirements.txt
